<!-- jQuery, only if your old UI code needs it -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.12.4/jquery.min.js"></script>

<!-- Modern SMART FHIR Client -->
<script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

<script>
  console.log("INDEX LOADED");

  FHIR.oauth2.ready()
    .then(client => {
      console.log("SMART client ready", client);
      console.log("Patient ID:", client.patient.id);

      return client.request("Patient/" + client.patient.id);
    })
    .then(patient => {
      console.log("Patient:", patient);

      document.getElementById("loading").style.display = "none";

      document.getElementById("fname").innerText =
        patient.name?.[0]?.given?.[0] || "";

      document.getElementById("lname").innerText =
        patient.name?.[0]?.family || "";

      document.getElementById("gender").innerText =
        patient.gender || "";

      document.getElementById("birthdate").innerText =
        patient.birthDate || "";
    })
    .catch(error => {
      console.error("FHIR error:", error);

      document.getElementById("loading").style.display = "none";
      document.getElementById("errors").innerHTML =
        "<p>Failed to call FHIR Service</p><pre>" +
        (error.message || JSON.stringify(error, null, 2)) +
        "</pre>";
    });
</script>
