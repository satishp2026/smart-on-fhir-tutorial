<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SMART FHIR App</title>
</head>

<body>

  <h2>SMART FHIR App</h2>

  <!-- Loading + error -->
  <div id="loading">Loading...</div>
  <div id="errors" style="color:red;"></div>

  <!-- Patient info -->
  <h3>Patient</h3>
  <p>First Name: <span id="fname"></span></p>
  <p>Last Name: <span id="lname"></span></p>
  <p>Gender: <span id="gender"></span></p>
  <p>DOB: <span id="birthdate"></span></p>

  <!-- SMART Client -->
  <script src="https://cdn.jsdelivr.net/npm/fhirclient/build/fhir-client.js"></script>

  <script>
    console.log("INDEX VERSION WITH ADDRESS + IDENTIFIER");

    FHIR.oauth2.ready()
      .then(client => {
        console.log("SMART ready");
        return client.request("Patient/" + client.patient.id);
      })
      .then(patient => {
        console.log("Patient:", patient);

        // Hide loading
        const loading = document.getElementById("loading");
        if (loading) loading.style.display = "none";

        // Basic fields
        document.getElementById("fname").innerText =
          patient.name?.[0]?.given?.[0] || "";

        document.getElementById("lname").innerText =
          patient.name?.[0]?.family || "";

        document.getElementById("gender").innerText =
          patient.gender || "";

        document.getElementById("birthdate").innerText =
          patient.birthDate || "";

        document.getElementById("maritalStatus").innerText =
          patient.maritalStatus?.text ||
          patient.maritalStatus?.coding?.[0]?.display ||
          "";

        // Address (array)
        const addressDiv = document.getElementById("address");
        if (patient.address && patient.address.length > 0) {
          addressDiv.innerHTML = patient.address.map(addr => `
            <div style="margin-bottom:10px;">
              ${addr.line?.join(", ") || ""}<br>
              ${addr.city || ""}, ${addr.state || ""} ${addr.postalCode || ""}<br>
              ${addr.country || ""}
            </div>
          `).join("");
        } else {
          addressDiv.innerText = "No address available";
        }

        // Identifier (array)
        const identifierDiv = document.getElementById("identifier");
        if (patient.identifier && patient.identifier.length > 0) {
          identifierDiv.innerHTML = patient.identifier.map(id => `
            <div style="margin-bottom:5px;">
              ${id.system || ""} : ${id.value || ""}
            </div>
          `).join("");
        } else {
          identifierDiv.innerText = "No identifiers available";
        }
      })
      .catch(error => {
        console.error("FHIR error:", error);

        const loading = document.getElementById("loading");
        if (loading) loading.style.display = "none";

        const errors = document.getElementById("errors");
        if (errors) {
          errors.innerHTML =
            "<p>Failed to call FHIR Service</p><pre>" +
            (error.message || JSON.stringify(error, null, 2)) +
            "</pre>";
        }
      });
  </script>

</body>
</html>
